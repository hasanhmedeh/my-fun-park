<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #preview {
        position: fixed;
        inset: 0;
      }
      #preview-status {
        position: fixed;
        left: 8px;
        bottom: 6px;
        font: 12px/1.3 ui-monospace, monospace;
        color: #fff;
        text-shadow: 0 1px 2px #000;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <!-- Dev-only: renders one module's scene for screenshots (see src/preview/main.ts). Not part of the build. -->
    <div id="preview"></div>
    <div id="preview-status"></div>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
